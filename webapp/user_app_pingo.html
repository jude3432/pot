<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MEGA | لوحة الحساب</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,'Segoe UI',Tahoma,sans-serif}
  :root{
    --bg:#f7f8fa;
    --bg2:#ffffff;
    --card:rgba(255,255,255,0.04);
    --card-border:rgba(17,19,24,0.12);
    --text:#111318;
    --hint:#667085;
    --gold:#111318;
    --gold-dim:rgba(17,19,24,0.15);
    --green:#00d68f;
    --red:#ff5252;
    --blue:#4a9eff;
    --purple:#a855f7;
  }
  body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px));overflow-x:hidden}

  /* خلفية متوهّجة */
  body::before{
    content:'';position:fixed;top:-100px;right:-100px;width:400px;height:400px;
    background:radial-gradient(circle,rgba(17,19,24,0.08) 0%,transparent 70%);
    pointer-events:none;z-index:0
  }
  body::after{
    content:'';position:fixed;bottom:-100px;left:-100px;width:350px;height:350px;
    background:radial-gradient(circle,rgba(74,158,255,0.06) 0%,transparent 70%);
    pointer-events:none;z-index:0
  }

  .container{padding:16px;position:relative;z-index:1}

  /* ===== الترويسة ===== */
  .header{
    position:relative;display:flex;justify-content:center;align-items:flex-start;
    min-height:clamp(112px,34vw,128px);margin:-10px 0 18px;padding-top:0
  }
  .header .brand-float{
    width:min(88vw,330px);max-width:100%;line-height:0;
    animation:brandFloat 8s ease-in-out 1.8s infinite;
    transform:translateZ(0)
  }
  .header .brand-lockup{
    --brand-art:none;
    appearance:none;-webkit-appearance:none;display:block;
    position:relative;width:100%;line-height:0;padding:0;border:0;background:transparent;
    opacity:0;transform:translateY(8px) scale(.975);filter:blur(6px);
    animation:brandReveal 1.45s cubic-bezier(.16,1,.3,1) .1s forwards;
    user-select:none;-webkit-user-select:none;cursor:pointer;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent
  }
  .header .brand-lockup:focus-visible{
    outline:1px solid rgba(17,19,24,.6);outline-offset:4px;border-radius:12px
  }
  .header .brand-logo{
    display:block;width:100%;height:auto;pointer-events:none;
    filter:drop-shadow(0 0 4px rgba(17,19,24,.2)) drop-shadow(0 8px 14px rgba(0,0,0,.65));
    animation:brandBreath 6.6s ease-in-out 1.9s infinite
  }
  .header .brand-lockup::after{
    content:'';position:absolute;inset:0;pointer-events:none;opacity:0;
    background:linear-gradient(112deg,transparent 35%,rgba(17,19,24,.05) 43%,rgba(17,19,24,.9) 49%,rgba(17,19,24,.18) 55%,transparent 63%);
    background-size:320% 100%;background-position:175% 0;
    -webkit-mask:var(--brand-art) center/contain no-repeat;
            mask:var(--brand-art) center/contain no-repeat;
    mix-blend-mode:screen;
    animation:brandShimmer 7.2s cubic-bezier(.45,.05,.55,.95) 1.65s infinite
  }
  .header .brand-refresh-note{
    position:absolute;left:50%;bottom:1px;translate:-50% 5px;
    color:var(--hint);font-size:9px;font-weight:700;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .2s,translate .2s
  }
  .header .brand-refresh-note.show{opacity:.82;translate:-50% 0}
  .header .brand-refresh-note.success{color:var(--green)}
  .header .brand-refresh-note.wait{color:#667085}
  .header .brand-lockup.is-refreshing .brand-logo{
    animation:brandManualPulse .72s ease-in-out infinite
  }
  .header .brand-lockup.is-refreshing::after{
    animation:brandManualShimmer .9s ease-in-out infinite
  }
  .header .brand-lockup.is-cooldown .brand-logo{
    animation:brandCooldown .42s ease
  }
  @keyframes brandReveal{to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
  @keyframes brandFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes brandBreath{
    0%,100%{filter:drop-shadow(0 0 3px rgba(17,19,24,.16)) drop-shadow(0 8px 14px rgba(0,0,0,.65))}
    50%{filter:drop-shadow(0 0 7px rgba(17,19,24,.3)) drop-shadow(0 9px 16px rgba(0,0,0,.72))}
  }
  @keyframes brandShimmer{
    0%,10%{background-position:175% 0;opacity:0}14%{opacity:.72}
    35%{background-position:-78% 0;opacity:.64}42%,100%{background-position:-78% 0;opacity:0}
  }
  @keyframes brandManualPulse{
    0%,100%{transform:scale(1);filter:brightness(1) drop-shadow(0 0 4px rgba(17,19,24,.2))}
    50%{transform:scale(1.012);filter:brightness(1.16) drop-shadow(0 0 9px rgba(17,19,24,.4))}
  }
  @keyframes brandManualShimmer{
    0%{background-position:175% 0;opacity:0}20%{opacity:.78}
    75%{background-position:-78% 0;opacity:.68}100%{background-position:-78% 0;opacity:0}
  }
  @keyframes brandCooldown{
    0%,100%{transform:scale(1)}50%{transform:scale(.985);filter:brightness(.88)}
  }
  @media(max-width:350px){.header .brand-float{width:min(88vw,305px)}}
  @media(prefers-reduced-motion:reduce){
    .header .brand-float,.header .brand-logo,.header .brand-lockup::after{animation:none}
    .header .brand-lockup{animation:none;opacity:1;transform:none;filter:none}
    .header .brand-lockup::after{display:none}
    .quick-btn,.flash-banner::after{animation:none}
  }

  /* ===== بطاقة الرصيد المتوهّجة ===== */
  .balance-card{
    background:linear-gradient(135deg,rgba(17,19,24,0.08) 0%,rgba(17,19,24,0.02) 100%);
    border:1px solid var(--card-border);
    border-radius:24px;padding:24px;margin-bottom:16px;
    position:relative;overflow:hidden;
    box-shadow:0 8px 32px rgba(17,19,24,0.08),inset 0 1px 0 rgba(255,255,255,0.05)
  }
  .balance-card::before{
    content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
    background:linear-gradient(45deg,transparent 30%,rgba(17,19,24,0.03) 50%,transparent 70%);
    animation:shimmer 4s linear infinite;pointer-events:none
  }
  @keyframes shimmer{0%{transform:translateX(-50%)}100%{transform:translateX(50%)}}

  /* ===== خصوصية الرصيد ===== */
  .balance-privacy{
    appearance:none;-webkit-appearance:none;position:absolute;left:14px;top:14px;z-index:3;
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    color:#111318;background:rgba(255,255,255,.96);border:1px solid rgba(17,19,24,.22);
    cursor:pointer;transition:transform .18s,border-color .18s
  }
  .balance-privacy:active{transform:scale(.92);border-color:rgba(17,19,24,.75)}
  .balance-privacy svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .balance-privacy .privacy-slash{opacity:0;transition:opacity .2s}
  body.balance-hidden .balance-privacy .privacy-slash{opacity:1}
  body.balance-hidden .balance-card .amount,
  body.balance-hidden .balance-card .amount-new,
  body.balance-hidden .balance-card .g-value,
  body.balance-hidden .balance-card .private-balance-line{
    filter:blur(7px);user-select:none;pointer-events:none
  }
  .balance-card .amount,.balance-card .amount-new,.balance-card .g-value,.balance-card .private-balance-line{transition:filter .2s}

  .balance-card .label{color:var(--hint);font-size:12px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .balance-card .amount{font-size:38px;font-weight:900;color:#111318;letter-spacing:-1px;line-height:1.1;margin-bottom:4px}
  .balance-card .amount-new{font-size:14px;color:var(--gold);font-weight:700;opacity:0.85}
  .balance-card .divider{height:1px;background:rgba(255,255,255,0.06);margin:16px 0}
  .balance-card .game-balance{display:flex;justify-content:space-between;align-items:center}
  .balance-card .game-balance .g-label{color:var(--hint);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
  .balance-card .game-balance .g-value{color:var(--green);font-size:18px;font-weight:900}

  #serviceGateBanner:empty{display:none}
  .service-gate-banner{margin-bottom:12px;padding:11px 13px;border-radius:16px;background:rgba(255,91,101,.09);border:1px solid rgba(255,91,101,.24);color:#ffc0c5;font-size:10px;font-weight:800;line-height:1.6}
  .quick-btn:disabled{opacity:.42;filter:grayscale(.5);cursor:not-allowed;transform:none}

  /* ===== الإجراءات الملكية السريعة ===== */
  .royal-actions{margin:0 0 16px}
  .royal-actions-title{
    display:flex;align-items:center;gap:8px;margin:2px 0 10px;
    color:#111318;font-size:10px;font-weight:900;white-space:nowrap
  }
  .royal-actions-title::before,.royal-actions-title::after{
    content:'';height:1px;flex:1;
    background:linear-gradient(90deg,transparent,rgba(17,19,24,.25),transparent)
  }
  .royal-actions-title span{
    position:relative;padding:3px 12px;border-radius:999px;
    background:#ffffff;border:1px solid rgba(17,19,24,.18)
  }
  .royal-actions-title span::before{
    content:'◆';position:absolute;left:50%;top:-9px;translate:-50% 0;
    color:#111318;font-size:7px
  }
  .quick-grid{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px
  }
  .quick-btn{
    --accent:0,214,143;
    appearance:none;-webkit-appearance:none;position:relative;isolation:isolate;
    width:100%;min-width:0;min-height:98px;color:inherit;font:inherit;text-align:center;
    background:#ffffff;
    border:1px solid rgba(17,19,24,.18);border-radius:17px;padding:14px 4px 12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;overflow:hidden;text-decoration:none;
    box-shadow:0 8px 20px rgba(17,19,24,.08),inset 0 1px 0 rgba(255,255,255,.8);
    transition:transform .18s,box-shadow .18s,border-color .18s;
    animation:royalButtonIn .5s cubic-bezier(.16,1,.3,1) both
  }
  .quick-btn:nth-child(2){animation-delay:.05s}.quick-btn:nth-child(3){animation-delay:.10s}.quick-btn:nth-child(4){animation-delay:.15s}
  .quick-btn::before{
    content:'';position:absolute;top:7px;left:50%;translate:-50% 0;
    width:5px;height:5px;border-radius:50%;background:rgb(var(--accent));
    border:1px solid rgba(17,19,24,.35);box-shadow:0 0 8px rgba(var(--accent),.42)
  }
  .quick-btn::after{
    content:'';position:absolute;bottom:7px;left:50%;translate:-50% 0;
    width:25px;height:3px;border-radius:999px;background:rgb(var(--accent));
    box-shadow:0 0 7px rgba(var(--accent),.30)
  }
  .quick-btn.withdraw{--accent:220,77,86}.quick-btn.gift{--accent:235,184,68}.quick-btn.referral{--accent:149,100,220}
  .quick-btn:active{transform:scale(.955);border-color:rgba(17,19,24,.70);box-shadow:0 4px 12px rgba(0,0,0,.16),0 0 14px rgba(17,19,24,.10)}
  .quick-btn .royal-icon{
    position:relative;width:42px;height:42px;border-radius:50%;
    display:grid;place-items:center;color:#ffffff;
    background:#111318;
    border:1.5px solid #111318;
    box-shadow:0 0 0 3px rgba(17,19,24,.10),inset 0 0 0 3px rgba(255,255,255,.16)
  }
  .quick-btn .royal-icon::after{
    content:'';position:absolute;inset:3px;border-radius:50%;border:1px solid rgba(17,19,24,.16)
  }
  .quick-btn .royal-icon svg{
    width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round;overflow:visible
  }
  .quick-btn .text{font-size:11px;font-weight:900;color:#111318;text-shadow:none}
  @keyframes royalButtonIn{from{opacity:0;transform:translateY(7px) scale(.98)}to{opacity:1;transform:none}}

  /* ===== حالة الطلب المعلق ===== */
  .pending-status-wrap:empty{display:none}
  .pending-status-wrap{display:grid;gap:7px;margin:-4px 0 16px}
  .pending-status-card{
    appearance:none;-webkit-appearance:none;width:100%;display:flex;align-items:center;gap:10px;
    padding:11px 13px;border-radius:15px;text-align:right;color:var(--text);font:inherit;
    background:linear-gradient(135deg,rgba(255,193,7,.09),rgba(17,19,24,.025));
    border:1px solid rgba(218,174,54,.25);cursor:pointer
  }
  .pending-status-dot{width:9px;height:9px;border-radius:50%;background:#111318;box-shadow:0 0 9px rgba(17,19,24,.18);flex:0 0 auto}
  .pending-status-copy{flex:1;min-width:0}.pending-status-title{font-size:11px;font-weight:900;color:#111318}
  .pending-status-sub{font-size:10px;color:var(--hint);margin-top:2px}.pending-status-arrow{color:#667085;font-size:14px}

  /* ===== بطاقة معلومات ===== */
  .info-card{
    background:var(--card);border:1px solid rgba(17,19,24,0.10);
    border-radius:20px;padding:16px;margin-bottom:16px
  }
  .info-card .title{
    font-size:14px;font-weight:900;color:var(--text);margin-bottom:14px;
    display:flex;align-items:center;justify-content:space-between
  }
  .info-card .title .badge{
    background:var(--gold-dim);color:var(--gold);padding:3px 10px;border-radius:20px;
    font-size:11px;font-weight:800
  }

  /* ===== قائمة المعاملات ===== */
  .tx-list{display:flex;flex-direction:column;gap:8px}
  .tx-item{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,0.02);border-radius:14px;padding:12px;
    border-right:3px solid transparent;transition:all 0.2s
  }
  .tx-item.deposit{border-right-color:var(--green)}
  .tx-item.withdraw{border-right-color:var(--red)}
  .tx-item.game{border-right-color:var(--blue)}
  .tx-item.bonus{border-right-color:var(--gold)}

  .tx-item .tx-icon{
    width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:18px;flex-shrink:0
  }
  .tx-item.deposit .tx-icon{background:rgba(0,214,143,0.12)}
  .tx-item.withdraw .tx-icon{background:rgba(255,82,82,0.12)}
  .tx-item.game .tx-icon{background:rgba(74,158,255,0.12)}
  .tx-item.bonus .tx-icon{background:var(--gold-dim)}

  .tx-item .tx-info{flex:1;min-width:0}
  .tx-item .tx-info .tx-type{font-size:13px;font-weight:700;color:var(--text)}
  .tx-item .tx-info .tx-date{font-size:11px;color:var(--hint);margin-top:2px}
  .tx-item .tx-amount{text-align:left;direction:ltr;font-size:15px;font-weight:900;white-space:nowrap}
  .tx-item .tx-amount.in{color:var(--green)}
  .tx-item .tx-amount.out{color:var(--red)}

  .tx-status{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px}
  .tx-status.approved{background:var(--green)}
  .tx-status.pending{background:var(--gold)}
  .tx-status.rejected{background:var(--red)}
  .tx-status.completed{background:var(--green)}

  .empty{text-align:center;color:var(--hint);padding:24px;font-size:13px}

  /* ===== بانر العروض ===== */
  .offer-banner{
    background:linear-gradient(135deg,rgba(17,19,24,0.12) 0%,rgba(168,85,247,0.08) 100%);
    border:1px solid var(--card-border);
    border-radius:20px;padding:16px;margin-bottom:16px;
    display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.25s
  }
  .offer-banner:active{transform:scale(0.98)}
  .offer-banner .offer-icon{font-size:32px}
  .offer-banner .offer-text{flex:1}
  .offer-banner .offer-text .offer-title{font-size:14px;font-weight:900;color:var(--gold)}
  .offer-banner .offer-text .offer-desc{font-size:12px;color:var(--hint);margin-top:2px}

  /* ===== بانر المسابقات ===== */
  .contest-banner{
    background:linear-gradient(135deg,rgba(168,85,247,0.12) 0%,rgba(74,158,255,0.08) 100%);
    border:1px solid rgba(168,85,247,0.2);
    border-radius:20px;padding:16px;margin-bottom:16px;
    display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.25s
  }
  .contest-banner:active{transform:scale(0.98)}
  .contest-banner .contest-icon{font-size:32px}
  .contest-banner .contest-text{flex:1}
  .contest-banner .contest-text .contest-title{font-size:14px;font-weight:900;color:#c084fc}
  .contest-banner .contest-text .contest-desc{font-size:12px;color:var(--hint);margin-top:2px}

  /* ===== بطاقة الحضور اليومي ===== */
  .checkin-card{
    background:linear-gradient(135deg,rgba(0,214,143,0.08) 0%,rgba(0,214,143,0.02) 100%);
    border:1px solid rgba(0,214,143,0.15);
    border-radius:20px;padding:16px;margin-bottom:16px;text-align:center
  }
  .checkin-card .ck-title{font-size:14px;font-weight:900;color:var(--green);margin-bottom:10px}
  .checkin-card .ck-streak{display:flex;justify-content:center;gap:4px;margin:10px 0}
  .checkin-card .ck-day{
    width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;background:rgba(255,255,255,0.04);color:var(--hint)
  }
  .checkin-card .ck-day.done{background:rgba(0,214,143,0.2);color:var(--green)}
  .checkin-card .ck-day.today{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold)}
  .checkin-btn{
    width:100%;background:var(--green);color:#f7f8fa;border:none;padding:14px;border-radius:14px;
    font-size:15px;font-weight:900;cursor:pointer;margin-top:10px;transition:all 0.2s
  }
  .checkin-btn:active{transform:scale(0.98)}
  .checkin-btn:disabled{background:rgba(255,255,255,0.06);color:var(--hint);cursor:not-allowed}

  /* ===== فلاش البونص الملكي في أعلى الصفحة ===== */
  #flashBanner:empty{display:none}
  #flashBanner{margin-bottom:12px}
  .flash-banner{
    background:linear-gradient(110deg,rgba(82,17,20,.93),rgba(31,18,13,.97) 58%,rgba(76,49,8,.86));
    border:1px solid rgba(242,190,66,.55);border-radius:18px;padding:11px 13px;
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;
    text-align:right;position:relative;overflow:hidden;
    box-shadow:0 7px 24px rgba(0,0,0,.30),0 0 18px rgba(255,93,56,.06)
  }
  .flash-banner::before{
    content:'⚡';position:static;font-size:24px;opacity:1;
    filter:drop-shadow(0 0 7px rgba(255,184,53,.45))
  }
  .flash-banner::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 35%,rgba(255,231,160,.10) 49%,transparent 62%);
    translate:-110% 0;animation:flashRoyalShine 4.8s ease-in-out infinite
  }
  .flash-banner .fl-title{font-size:13px;font-weight:900;color:#ffd36a;margin:0}
  .flash-banner .fl-desc{font-size:9px;color:#d7b9a6;margin-top:2px;grid-column:2}
  .flash-banner .fl-timer{font-size:16px;font-weight:900;color:#111318;direction:ltr;grid-column:3;grid-row:1/3}
  @keyframes flashRoyalShine{0%,72%{translate:-110% 0}100%{translate:110% 0}}

  /* ===== لوحة الصدارة ===== */
  .lb-item{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,0.02);border-radius:12px;padding:10px 12px;margin-top:6px
  }
  .lb-item .lb-rank{
    width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:900;flex-shrink:0;background:rgba(255,255,255,0.06)
  }
  .lb-item.r1 .lb-rank{background:rgba(17,19,24,0.2);color:var(--gold)}
  .lb-item.r2 .lb-rank{background:rgba(192,192,192,0.2);color:#c0c0c0}
  .lb-item.r3 .lb-rank{background:rgba(205,127,50,0.2);color:#cd7f32}
  .lb-item .lb-name{flex:1;font-size:13px;font-weight:700}
  .lb-item .lb-val{font-size:14px;font-weight:900;color:var(--gold);direction:ltr}
  .lb-item.me{border:1px solid var(--gold);background:var(--gold-dim)}

  /* ===== عجلة الحظ ===== */
  .wheel-container{text-align:center;padding:10px 0;margin-bottom:12px}
  .wheel-wrapper{position:relative;width:280px;height:280px;margin:0 auto 16px;filter:drop-shadow(0 18px 22px rgba(0,0,0,0.55))}
  .wheel-svg{width:100%;height:100%;transition:transform 4s cubic-bezier(0.17,0.67,0.12,0.99);transform:rotate(0deg)}
  .wheel-pointer{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--gold);z-index:10;filter:drop-shadow(0 0 8px rgba(17,19,24,0.8))}
  .wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#ffffff,var(--gold),#667085);display:flex;align-items:center;justify-content:center;font-size:26px;z-index:5;box-shadow:0 0 16px rgba(17,19,24,0.45),0 4px 12px rgba(0,0,0,0.5);border:3px solid #fff1a6}
  .spin-btn{width:100%;background:linear-gradient(135deg,var(--gold),#111318);color:#f7f8fa;border:none;padding:16px;border-radius:16px;font-size:18px;font-weight:900;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 16px rgba(17,19,24,0.2)}
  .spin-btn:active{transform:scale(0.97)}
  .spin-btn:disabled{background:rgba(255,255,255,0.06);color:var(--hint);cursor:not-allowed;box-shadow:none}
  .wheel-result{font-size:16px;font-weight:900;margin-top:12px;padding:12px;border-radius:12px;animation:fadeIn 0.4s}
  .wheel-result.win{background:var(--gold-dim);color:var(--gold)}
  .wheel-result.lose{background:rgba(255,255,255,0.04);color:var(--hint)}
  .wheel-result.pingo{background:linear-gradient(135deg,#ffffff,var(--gold),#111318);color:#050505;box-shadow:0 0 16px rgba(17,19,24,0.35)}

  /* ===== انتقال واضح من Mini App إلى مسار البوت ===== */
  .bot-flow-overlay{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:24px;background:rgba(3,5,10,.84);backdrop-filter:blur(9px);opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
  .bot-flow-overlay.show{opacity:1;visibility:visible}
  .bot-flow-card{width:min(88vw,310px);padding:22px 18px;border-radius:20px;text-align:center;background:linear-gradient(150deg,#151713,#090c14);border:1px solid rgba(224,178,67,.48);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 22px rgba(224,178,67,.08)}
  .bot-flow-spinner{width:34px;height:34px;margin:0 auto 12px;border:3px solid rgba(224,178,67,.16);border-top-color:#e0b243;border-radius:50%;animation:botFlowSpin .7s linear infinite}
  .bot-flow-card b{display:block;color:#f0d17b;font-size:14px}.bot-flow-card small{display:block;color:var(--hint);font-size:10px;margin-top:6px;line-height:1.6}
  @keyframes botFlowSpin{to{transform:rotate(360deg)}}

  /* ===== شريط التنقّل السفلي ===== */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:rgba(10,14,26,0.95);backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,0.06);
    display:flex;justify-content:space-around;padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px));z-index:100
  }
  .nav-item{
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
    color:var(--hint);font-size:10px;font-weight:700;transition:all 0.2s;background:none;border:none
  }
  .nav-item.active{color:var(--gold)}
  .nav-item .nav-icon{font-size:20px}

  /* ===== الحالات ===== */
  .loader{text-align:center;padding:60px 20px;color:var(--hint)}
  .spinner{width:36px;height:36px;border:3px solid rgba(17,19,24,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .error-box{background:rgba(255,82,82,0.08);border:1px solid var(--red);color:var(--red);border-radius:16px;padding:20px;text-align:center;font-size:13px;line-height:1.7}

  /* ===== صفحات (tabs) ===== */
  .page{display:none;animation:fadeIn 0.3s ease}
  .page.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="container">
  <!-- الترويسة -->
  <div class="header">
    <div class="brand-float">
      <button class="brand-lockup" id="brandLockup" type="button" onclick="refreshFromLogo()" aria-label="تحديث بيانات الحساب عبر شعار MEGA">
        <svg class="brand-logo" viewBox="0 0 720 220" role="img" aria-label="MEGA" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="12" width="696" height="196" rx="48" fill="#111318"/><path d="M92 146V74h18l25 34 25-34h18v72h-18v-45l-25 35-25-35v45z" fill="#fff"/><text x="392" y="145" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="96" font-weight="800" letter-spacing="5" fill="#fff">MEGA</text></svg>
      </button>
    </div>
    <div class="brand-refresh-note" id="brandRefreshNote" role="status" aria-live="polite"></div>
  </div>

  <div id="errorBox"></div>

  <!-- ===== الصفحة الرئيسية ===== -->
  <div class="page active" id="pageHome">
    <!-- فلاش البونص: أعلى الصفحة ولا يشغل مساحة عندما يكون غير نشط -->
    <div id="flashBanner"></div>
    <div id="serviceGateBanner"></div>

    <!-- بطاقة الرصيد -->
    <div id="balanceCard">
      <div class="loader"><div class="spinner"></div>جارٍ التحميل...</div>
    </div>

    <!-- الإجراءات الملكية السريعة -->
    <section class="royal-actions" aria-label="الخدمات السريعة">
      <div class="royal-actions-title"><span>الخدمات السريعة</span></div>
      <div class="quick-grid">
        <button class="quick-btn deposit" type="button" onclick="openBotFlow('deposit')" aria-label="فتح شحن الرصيد في البوت">
          <span class="icon royal-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path d="M24 9v20M16 21l8 9 8-9"/><path d="M12 31v7h24v-7"/></svg>
          </span>
          <span class="text">شحن</span>
        </button>
        <button class="quick-btn withdraw" type="button" onclick="openBotFlow('withdraw')" aria-label="فتح سحب الرصيد في البوت">
          <span class="icon royal-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path d="M24 31V11M16 19l8-9 8 9"/><path d="M12 31v7h24v-7"/></svg>
          </span>
          <span class="text">سحب</span>
        </button>
        <button class="quick-btn gift" type="button" onclick="openBotFlow('gift')" aria-label="فتح إهداء الرصيد في البوت">
          <span class="icon royal-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path d="M10 21h28v19H10zM8 15h32v8H8zM24 15v25"/><path d="M24 15c-7 0-10-3-10-6 0-2 2-4 5-3 3 1 5 5 5 9zm0 0c7 0 10-3 10-6 0-2-2-4-5-3-3 1-5 5-5 9z"/></svg>
          </span>
          <span class="text">إهداء</span>
        </button>
        <button class="quick-btn referral" type="button" onclick="showPage('referral')" aria-label="فتح صفحة الإحالات">
          <span class="icon royal-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48"><circle cx="24" cy="17" r="6"/><circle cx="12" cy="21" r="4"/><circle cx="36" cy="21" r="4"/><path d="M14 39c1-8 5-12 10-12s9 4 10 12M4 38c1-6 4-9 8-9 2 0 4 1 5 2M44 38c-1-6-4-9-8-9-2 0-4 1-5 2"/></svg>
          </span>
          <span class="text">إحالات</span>
        </button>
      </div>
    </section>

    <!-- حالة الطلبات المعلقة من البيانات المحمّلة نفسها -->
    <div id="pendingStatus" class="pending-status-wrap" aria-live="polite"></div>
    <!-- بطاقة VIP -->
    <div id="vipCard"></div>

    <!-- الكاش باك -->
    <div id="cashbackCard"></div>

    <!-- بانر العروض (يظهر فقط لو يوجد عرض) -->
    <div id="offerBanner"></div>

    <!-- بانر المسابقات (يظهر فقط لو يوجد مسابقة مفتوحة) -->
    <div id="contestBanner"></div>

    <!-- عجلة الحظ (تظهر فقط لو مفعّلة ولديه لفة متاحة) -->
    <div id="wheelCard"></div>

    <!-- الحضور اليومي -->
    <div id="checkinCard"></div>

    <!-- آخر المعاملات -->
    <div class="info-card">
      <div class="title">
        <span>🕒 آخر العمليات</span>
        <span class="badge" id="txCount">0</span>
      </div>
      <div id="txList" class="tx-list">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- ===== صفحة السجل الكامل ===== -->
  <div class="page" id="pageHistory">
    <div class="info-card">
      <div class="title"><span>📋 سجل المعاملات الكامل</span></div>
      <div id="fullTxList" class="tx-list"></div>
    </div>
  </div>

  <!-- ===== صفحة الإحالات ===== -->
  <div class="page" id="pageReferral">
    <div id="referralContent"></div>
  </div>

  <!-- ===== صفحة المزايا ===== -->
  <div class="page" id="pagePerks">
    <div id="perksContent"></div>
  </div>
</div>

<!-- شاشة انتقال قصيرة حتى يرى المستخدم نتيجة الضغط قبل إغلاق Mini App -->
<div class="bot-flow-overlay" id="botFlowOverlay" role="status" aria-live="assertive" aria-hidden="true">
  <div class="bot-flow-card"><div class="bot-flow-spinner" aria-hidden="true"></div><b id="botFlowTitle">جارٍ نقلك إلى البوت</b><small>سيتم إغلاق الداشبورد تلقائيًا وإظهار المسار المطلوب.</small></div>
</div>

<!-- شريط التنقّل السفلي -->
<div class="bottom-nav">
  <button class="nav-item active" id="navHome" onclick="showPage('home')">
    <div class="nav-icon">🏠</div><span>الرئيسية</span>
  </button>
  <button class="nav-item" id="navHistory" onclick="showPage('history')">
    <div class="nav-icon">📋</div><span>السجل</span>
  </button>
  <button class="nav-item" id="navReferral" onclick="showPage('referral')">
    <div class="nav-icon">💰</div><span>الإحالات</span>
  </button>
  <button class="nav-item" id="navPerks" onclick="showPage('perks')">
    <div class="nav-icon">🏆</div><span>المزايا</span>
  </button>
</div>

<script>
const brandLockup = document.getElementById('brandLockup');
const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : {initData:'',ready(){},expand(){},close(){}};
let initData = tg.initData || '';
tg.ready();
tg.expand();
tg.setHeaderColor('#f7f8fa');
tg.setBackgroundColor('#f7f8fa');

const API = window.location.origin + '/api/user/me';

// تحديث يدوي اقتصادي: لا Polling ولا قراءة إضافية قبل مرور 60 ثانية.
const BRAND_REFRESH_COOLDOWN_MS = 60000;
let lastDataRefreshAt = 0;
let brandRefreshBusy = false;
let brandRefreshNoteTimer = null;

function showBrandRefreshNote(message, type='success'){
  const note=document.getElementById('brandRefreshNote');
  if(!note)return;
  if(brandRefreshNoteTimer)clearTimeout(brandRefreshNoteTimer);
  note.textContent=message;
  note.className='brand-refresh-note show '+type;
  brandRefreshNoteTimer=setTimeout(()=>{note.className='brand-refresh-note';},1600);
}

async function refreshFromLogo(){
  const lockup=document.getElementById('brandLockup');
  if(brandRefreshBusy)return;
  const remaining=BRAND_REFRESH_COOLDOWN_MS-(Date.now()-lastDataRefreshAt);
  if(lastDataRefreshAt && remaining>0){
    lockup?.classList.remove('is-cooldown');
    void lockup?.offsetWidth;
    lockup?.classList.add('is-cooldown');
    setTimeout(()=>lockup?.classList.remove('is-cooldown'),450);
    showBrandRefreshNote(`محدّث • انتظر ${Math.ceil(remaining/1000)}ث`,'wait');
    tg?.HapticFeedback?.selectionChanged?.();
    return;
  }
  brandRefreshBusy=true;
  lockup?.classList.add('is-refreshing');
  lockup?.setAttribute('aria-busy','true');
  tg?.HapticFeedback?.impactOccurred?.('light');
  const ok=await loadAll();
  lockup?.classList.remove('is-refreshing');
  lockup?.removeAttribute('aria-busy');
  brandRefreshBusy=false;
  showBrandRefreshNote(ok?'تم تحديث البيانات':'تعذّر التحديث',ok?'success':'wait');
  if(ok)tg?.HapticFeedback?.notificationOccurred?.('success');
}

function fmt(n){return new Intl.NumberFormat('en-US').format(Number(n||0));}
function closeApp(){tg.close();}

// MINIAPP_SHORTCUTS_BEGIN — client handoff; no API or Neon request.
const BOT_USERNAME = 'Mega77_77_Bot';
const BOT_FLOW_PAYLOADS = Object.freeze({
  deposit: 'app_deposit',
  withdraw: 'app_withdraw',
  gift: 'app_gift'
});
const BOT_FLOW_LABELS = Object.freeze({deposit:'مسار شحن الرصيد',withdraw:'مسار سحب الرصيد',gift:'مسار إهداء الرصيد'});
let botFlowOpening=false;

function buildBotFlowUrl(action){
  const payload=BOT_FLOW_PAYLOADS[action];
  return payload ? `https://t.me/${BOT_USERNAME}?start=${payload}` : null;
}
function showBotFlowOverlay(action){
  const overlay=document.getElementById('botFlowOverlay');
  const title=document.getElementById('botFlowTitle');
  if(title)title.textContent=`جارٍ فتح ${BOT_FLOW_LABELS[action]||'المسار المطلوب'}`;
  overlay?.classList.add('show');overlay?.setAttribute('aria-hidden','false');
}
function hideBotFlowOverlay(){const overlay=document.getElementById('botFlowOverlay');overlay?.classList.remove('show');overlay?.setAttribute('aria-hidden','true')}
function scheduleMiniAppClose(){
  setTimeout(()=>{try{tg?.close?.()}catch(_){}},420);
  setTimeout(()=>{hideBotFlowOverlay();botFlowOpening=false},1800);
}
function openBotFlow(action){
  const url=buildBotFlowUrl(action);
  if(!url||botFlowOpening)return false;
  botFlowOpening=true;showBotFlowOverlay(action);
  tg?.HapticFeedback?.impactOccurred?.('light');
  if(typeof tg?.openTelegramLink==='function'){
    try{tg.openTelegramLink(url);scheduleMiniAppClose()}catch(_){botFlowOpening=false;hideBotFlowOverlay();window.location.href=url}
  }else{
    botFlowOpening=false;window.location.href=url;
  }
  return true;
}
// MINIAPP_SHORTCUTS_END

// UX_PACK_BEGIN — local-only privacy, hint, and pending summaries.
const BALANCE_PRIVACY_KEY='caesar_balance_hidden_v1';
const LOGO_HINT_KEY='caesar_logo_refresh_hint_v1';
const PENDING_TYPE_LABELS=Object.freeze({
  deposit_bot:'إيداع رصيد',
  withdraw_bot:'سحب رصيد',
  deposit_to_game:'شحن اللعبة',
  withdraw_from_game:'سحب من اللعبة',
  gift:'هدية'
});

function readLocalFlag(key){
  try{return localStorage.getItem(key)==='1'}catch(_){return false}
}
function writeLocalFlag(key,value){
  try{localStorage.setItem(key,value?'1':'0')}catch(_){}
}
function applyBalancePrivacy(hidden){
  document.body.classList.toggle('balance-hidden',Boolean(hidden));
  const button=document.querySelector('.balance-privacy');
  button?.setAttribute('aria-pressed',hidden?'true':'false');
}
function toggleBalancePrivacy(){
  const hidden=!document.body.classList.contains('balance-hidden');
  applyBalancePrivacy(hidden);
  writeLocalFlag(BALANCE_PRIVACY_KEY,hidden);
  tg?.HapticFeedback?.selectionChanged?.();
}
function showLogoHintOnce(){
  if(readLocalFlag(LOGO_HINT_KEY))return false;
  writeLocalFlag(LOGO_HINT_KEY,true);
  showBrandRefreshNote('اضغط على الشعار لتحديث الأرصدة','wait');
  return true;
}
function getPendingTransactions(transactions){
  return (Array.isArray(transactions)?transactions:[])
    .filter(tx=>String(tx?.status||'').toLowerCase()==='pending')
    .slice(0,2)
    .map(tx=>({
      id:String(tx?.id??'—'),
      type:PENDING_TYPE_LABELS[tx?.type]||'طلب مالي'
    }));
}
function renderServiceGates(gates){
  const g=gates||{};
  const box=document.getElementById('serviceGateBanner');
  const maintenance=Boolean(g.maintenance_mode);
  if(box)box.innerHTML=maintenance?'<div class="service-gate-banner">🛡️ البوت في وضع الصيانة حاليًا. بعض الخدمات متوقفة مؤقتًا.</div>':'';
  const deposit=document.querySelector('.quick-btn.deposit');
  const withdraw=document.querySelector('.quick-btn.withdraw');
  const gift=document.querySelector('.quick-btn.gift');
  if(deposit)deposit.disabled=maintenance||g.deposits_enabled===false;
  if(withdraw)withdraw.disabled=maintenance||g.withdrawals_enabled===false;
  if(gift)gift.disabled=maintenance;
}

function renderPendingStatus(transactions){
  const box=document.getElementById('pendingStatus');
  if(!box)return;
  const pending=getPendingTransactions(transactions);
  box.innerHTML=pending.map(item=>`
    <button class="pending-status-card" type="button" onclick="showPage('history')">
      <span class="pending-status-dot" aria-hidden="true"></span>
      <span class="pending-status-copy"><span class="pending-status-title">${item.type} #${item.id}</span><span class="pending-status-sub">قيد المراجعة — اضغط لفتح السجل</span></span>
      <span class="pending-status-arrow" aria-hidden="true">‹</span>
    </button>`).join('');
}
applyBalancePrivacy(readLocalFlag(BALANCE_PRIVACY_KEY));
// UX_PACK_END

function showPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const map = {home:'pageHome',history:'pageHistory',referral:'pageReferral',perks:'pagePerks'};
  const navMap = {home:'navHome',history:'navHistory',referral:'navReferral',perks:'navPerks'};
  document.getElementById(map[page]).classList.add('active');
  document.getElementById(navMap[page]).classList.add('active');
  if(page==='history') loadFullHistory();
  if(page==='referral') loadReferral();
  if(page==='perks') loadPerks();
}

async function apiGet(url){
  const res = await fetch(url, {headers:{'X-Telegram-Init-Data':initData}});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}

async function loadAll(){
  document.getElementById('errorBox').innerHTML='';
  try{
    const d = await apiGet(API);
    renderBalance(d);
    renderServiceGates(d.service_gates||{});
    renderPendingStatus(d.recent_transactions||[]);
    renderVIP(d);
    renderCashback(d);
    renderOffers(d);
    renderContests(d);
    renderFlash(d);
    renderCheckin(d);
    renderWheel(d);
    // حفظ قطاعات العجلة
    if(d.features&&d.features.wheel_segments){
      wheelSegments=d.features.wheel_segments;
    }
    renderRecentTx(d.recent_transactions||[]);
    lastDataRefreshAt=Date.now();
    return true;
  }catch(e){
    document.getElementById('errorBox').innerHTML='<div class="error-box">⚠️ تعذّر تحميل البيانات.<br>تأكد من فتح اللوحة من زر البوت.</div>';
    document.getElementById('balanceCard').innerHTML='';
    document.getElementById('pendingStatus').innerHTML='';
    return false;
  }
}

// 🏆 (Update 16) نظام VIP
function renderVIP(d){
  const feat=d.features||{};
  const box=document.getElementById('vipCard');
  if(feat.vip_enabled===false){box.innerHTML='';return}
  const vip=d.vip||{};
  if(!vip.tier_name){box.innerHTML='';return}
  
  const total=vip.total_deposits||0;
  const next=vip.next_tier;
  const names=vip.tier_names||['🥉 مواطن','🥈 فارس','🥇 نبيل','👑 MEGA'];
  const colors=['var(--hint)','#c0c0c0','#111318','#111318'];
  const tierColor=colors[vip.tier_index||0];
  
  let progressBar='';
  let nextText='';
  if(next){
    const currentThreshold=vip.tier_index>0?[0,500000,2000000,5000000][vip.tier_index]:0;
    const range=next.threshold-currentThreshold;
    const done=total-currentThreshold;
    const pct=Math.min((done/range)*100,100);
    progressBar=`<div style="background:rgba(255,255,255,0.05);border-radius:10px;height:12px;overflow:hidden;margin:10px 0"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,${tierColor},var(--gold));border-radius:10px;transition:width 0.5s"></div></div>`;
    nextText=`<div style="font-size:11px;color:var(--hint);margin-top:4px">باقي <b style="color:var(--text)">${fmt(next.remaining)}</b> ل.س للترقية إلى ${names[next.index]}</div>`;
  }

  box.innerHTML=`
    <div class="info-card" style="background:linear-gradient(135deg,${tierColor}15 0%,rgba(255,255,255,0.02) 100%);border-color:${tierColor}30">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:18px;font-weight:900;color:${tierColor}">${vip.tier_name}</div>
        ${vip.current_bonus_pct>0?`<div class="pill" style="background:${tierColor}20;color:${tierColor}">+${vip.current_bonus_pct}% بونص</div>`:''}
      </div>
      <div style="font-size:12px;color:var(--hint)">إجمالي إيداعاتك: <b style="color:var(--text)">${fmt(total)}</b> ل.س</div>
      ${progressBar}
      ${nextText}
    </div>
  `;
}

// 💸 (Update 17) الكاش باك
function renderCashback(d){
  const cb=d.cashback||{};
  const box=document.getElementById('cashbackCard');
  if(!cb.enabled){box.innerHTML='';return}
  const loss=cb.week_net_loss||0;
  const expected=cb.expected_cashback||0;
  const pct=cb.pct||5;
  const minLoss=cb.min_loss||50000;
  
  let statusText='';
  let statusColor='var(--hint)';
  if(cb.already_paid){
    statusText='✅ تم صرف كاش باك هذا الأسبوع';
    statusColor='var(--green)';
  }else if(loss>=minLoss){
    statusText=`🎁 كاش باك متوقع: ${fmt(expected)} ل.س`;
    statusColor='var(--gold)';

function txTypeLabel(t){
  const m={'deposit_bot':'إيداع','withdraw_bot':'سحب','deposit_to_game':'شحن لعبة','withdraw_from_game':'سحب من لعبة','gift':'هدية'};
  return m[t]||t||'—';
}
function txClass(t){
  if(t&&t.includes('deposit'))return 'deposit';
  if(t&&t.includes('withdraw'))return 'withdraw';
  if(t&&t.includes('game'))return 'game';
  return 'bonus';
}
function txIcon(t){
  if(t&&t.includes('deposit'))return '📥';
  if(t&&t.includes('withdraw'))return '📤';
  if(t&&t.includes('game'))return '🎮';
  return '🎁';
}
function txSign(t){
  if(t&&t.includes('withdraw'))return '-';
  return '+';
}

let wheelSegments=[[0,1,'PINGO'],[0,1,'0%'],[1,1,'+1%'],[2,1,'+2%'],[0,1,'0%'],[3,1,'+3%'],[4,1,'+4%'],[0,1,'0%']];
function openWheel(depositTxId, depositAmount){
  showWheelModal(depositTxId, depositAmount, wheelSegments);
}

function buildWheelSVG(segments){
  const n=segments.length;
  const angle=360/n;
  const cx=130,cy=130,r=120;
  let paths='';
  let labels='';
  for(let i=0;i<n;i++){
    const startAngle=i*angle-90;
    const endAngle=(i+1)*angle-90;
    const x1=cx+r*Math.cos(startAngle*Math.PI/180);
    const y1=cy+r*Math.sin(startAngle*Math.PI/180);
    const x2=cx+r*Math.cos(endAngle*Math.PI/180);
    const y2=cy+r*Math.sin(endAngle*Math.PI/180);
    const midAngle=startAngle+angle/2;
    const largeArc=angle>180?1:0;
    const rawLabel=segments[i][2] || (segments[i][0]===0?'0%':`+${segments[i][0]}%`);
    const isPingo=String(rawLabel).toUpperCase()==='PINGO';
    const fill=isPingo?'url(#wheelGold)':'url(#wheelBlack)';
    const stroke='#111318';
    paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc},1 ${x2},${y2} Z" fill="${fill}" stroke="${stroke}" stroke-width="2.8"/>`;
    const tx=cx+(r*0.68)*Math.cos(midAngle*Math.PI/180);
    const ty=cy+(r*0.68)*Math.sin(midAngle*Math.PI/180);
    const text=isPingo?'PINGO':(segments[i][0]===0?'0%':`+${segments[i][0]}%`);
    const color=isPingo?'#050505':'#111318';
    const size=isPingo?'13':'14';
    labels+=`<text x="${tx}" y="${ty}" fill="${color}" font-size="${size}" font-weight="900" text-anchor="middle" dominant-baseline="middle" transform="rotate(${midAngle+90},${tx},${ty})">${text}</text>`;
  }
  return `<svg class="wheel-svg" id="wheelSVG" viewBox="0 0 260 260">
    <defs>
      <linearGradient id="wheelGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.42" stop-color="#111318"/><stop offset="1" stop-color="#667085"/></linearGradient>
      <linearGradient id="wheelBlack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#050505"/></linearGradient>
    </defs>
    <circle cx="130" cy="130" r="128" fill="#050505" stroke="url(#wheelGold)" stroke-width="8"/>
    ${paths}${labels}
    <circle cx="130" cy="130" r="44" fill="url(#wheelGold)" stroke="#ffffff" stroke-width="4"/>
    <text x="130" y="137" text-anchor="middle" font-size="26" font-weight="900">👑</text>
  </svg>`;
}

function showWheelModal(depositTxId,depositAmount,segments){
  const segCount=segments.length;
  const segAngle=360/segCount;
  const html=`
    <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px" id="wheelOverlay">
      <h2 style="color:var(--gold);margin-bottom:6px;font-size:20px">🎰 عجلة الحظ</h2>
      <p style="color:var(--hint);font-size:12px;margin-bottom:16px">إيداعك: ${fmt(depositAmount)} ل.س</p>
      <div class="wheel-wrapper">
        <div class="wheel-pointer"></div>

      <div id="wheelResultBox"></div>

async function doSpin(depositTxId){
  if(isSpinning)return;
  isSpinning=true;
  const btn=document.getElementById('spinBtn');
  btn.disabled=true;
  btn.textContent='...دوّر';

  try{
    const res=await fetch(API.replace('/me','/spin-wheel'),{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},
      body:JSON.stringify({deposit_tx_id:depositTxId})
    });
    const data=await res.json();
    if(!res.ok){tg.showAlert(data.error||'خطأ');btn.disabled=false;btn.textContent='🎰 دوّر العجلة!';isSpinning=false;return}

    // 🎯 (Update 15 Fix) مزامنة العجلة مع الخادم بدقة 100%
    // كل قطاع يأخذ زاوية (360 / عدد القطاعات)
    const segCount = 8; 
    const segAngle = 360 / segCount;
    const targetIndex = data.segment_index;

    // لحساب الزاوية: المؤشر ثابت في الأعلى. كل قطاع يبدأ من حد وينتهي بحد.
    // يجب أن يقف المؤشر في منتصف القطاع الفائز، وليس على الحد بين قطاعين.
    // لذلك نضيف نصف زاوية القطاع: (targetIndex + 0.5) * segAngle.
    const extraSpins = 5; 
    const targetRotation = -(extraSpins * 360 + ((targetIndex + 0.5) * segAngle));
    
    // ضمان أن العجلة تكمل الدوران للأمام ولا تعود للخلف بصرياً
    const currentMod = currentRotation % 360;
    const finalRotation = currentRotation - currentMod + targetRotation;
    currentRotation = finalRotation; // تحديث المرجع للدوران القادم

    const wheel=document.getElementById('wheelSVG');
    wheel.style.transition='transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
    wheel.style.transform=`rotate(${finalRotation}deg)`;

    // نتيجة بعد 4 ثوانٍ
    setTimeout(()=>{
      const box=document.getElementById('wheelResultBox');
      if(String(data.label||'').toUpperCase()==='PINGO'){
        box.innerHTML=`<div class="wheel-result pingo">🎯 PINGO!<br><span style="font-size:12px">جائزة خاصة — ستتواصل معك الإدارة للحصول على كود هدية 🎁</span></div>`;
      }else if(data.reward_amount>0){
        box.innerHTML=`<div class="wheel-result win">🎉 مبروك! ربحت +${data.reward_percent}% = ${fmt(data.reward_amount)} ل.س<br><span style="font-size:11px">أُضيفت لرصيد المكافآت 🎁</span></div>`;
      }else{
        box.innerHTML=`<div class="wheel-result lose">💔 حظ أوفر! حاول مرة أخرى في الإيداع القادم</div>`;
      }
      btn.textContent='✅ تم';
      btn.style.background='var(--green)';
      isSpinning=false;
      // تحديث البيانات
      setTimeout(()=>{closeWheel();loadAll()},2000);
    },4200);

  }catch(e){
    tg.showAlert('خطأ في الاتصال');
    btn.disabled=false;
    btn.textContent='🎰 دوّر العجلة!';
    isSpinning=false;
  }
}

// ===== فلاش البونص =====
// FLASH_METHOD_DISPLAY_BEGIN
const FLASH_METHOD_LABELS=Object.freeze({
  all:'كل طرق الإيداع',
  syriatel:'سيريتل كاش',
  mtn:'MTN كاش',
  sham_syp:'شام كاش (ليرة)',
  sham_usd:'شام كاش (دولار)',
  usdt_trc:'USDT (TRC20)',
  usdt_bep:'USDT (BEP20)'
});
function getFlashBannerDescription(flash){
  const method=String(flash?.payment_method||'all').trim().toLowerCase();
  if(method==='all')return 'على كل طرق الإيداع — لوقت محدود';
  const label=FLASH_METHOD_LABELS[method]||'طريقة الدفع المحددة';
  return `حصريًا على إيداعات ${label} — لوقت محدود`;
}
// FLASH_METHOD_DISPLAY_END
let flashInterval=null;
function renderFlash(d){
  const fb=d.flash_bonus;
  const box=document.getElementById('flashBanner');
  if(!fb){box.innerHTML='';if(flashInterval){clearInterval(flashInterval);flashInterval=null}return}
  const endsAt=new Date(fb.ends_at);
  const methodDescription=getFlashBannerDescription(fb);
  function update(){
    const now=new Date();
    const diff=endsAt-now;
    if(diff<=0){box.innerHTML='';if(flashInterval)clearInterval(flashInterval);return}
    const m=Math.floor(diff/60000);
    const s=Math.floor((diff%60000)/1000);
    box.innerHTML=`
      <div class="flash-banner">
        <div class="fl-title">⚡ فلاش بونص ${fb.percent}%!</div>
        <div class="fl-desc">${methodDescription}</div>
        <div class="fl-timer">⏰ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div>
      </div>`;
  }
  update();
  if(flashInterval)clearInterval(flashInterval);
  flashInterval=setInterval(update,1000);
}

// ===== لوحة الصدارة + صفحة المزايا =====
async function loadPerks(){
  const el=document.getElementById('perksContent');
  el.innerHTML='<div class="loader"><div class="spinner"></div></div>';
  try{
    const d=await apiGet(API);
    const feat=d.features||{};
    const lb=d.leaderboard||{};
    const top=lb.top||[];
    const myRank=lb.my_rank;
    const myBal=lb.my_balance||0;

    const topHtml=top.map(u=>{
      const rc=u.rank<=3?'r'+u.rank:'';
      const medal=u.rank===1?'🥇':u.rank===2?'🥈':u.rank===3?'🥉':u.rank;
      return `<div class="lb-item ${rc}"><div class="lb-rank">${medal}</div><div class="lb-name">${u.username}</div><div class="lb-val">${fmt(u.balance)}</div></div>`;
    }).join('');

    const myHtml=myRank?`<div class="lb-item me"><div class="lb-rank">${myRank}</div><div class="lb-name">أنت</div><div class="lb-val">${fmt(myBal)}</div></div>`:'';

    // الحضور في صفحة المزايا أيضاً
    const ck=d.checkin||{};
    const streak=ck.current_streak||0;
    const cycle=ck.cycle_days||30;
    const btn=ck.can_checkin?`<button class="checkin-btn" onclick="doCheckin()">📅 سجّل حضور اليوم</button>`:`<div class="checkin-btn" style="cursor:default;background:rgba(255,255,255,0.06);color:var(--hint)">✅ سجّلت اليوم — عُد غداً!</div>`;

    const checkinHtml=feat.checkin_enabled!==false?`
      <div class="info-card">
        <div class="title"><span>📅 الحضور اليومي</span><span class="badge">التقدم: ${streak} / ${cycle} يوم</span></div>
        <div style="font-size:12px;color:var(--hint);margin-bottom:10px">سجّل حضورك يومياً لإكمال دورة 30 يوم دون انقطاع. المكافأة (${fmt(ck.completion_reward||20000)} ل.س) تُصرف عند أول شحن لعبة ناجح بعد تحقق شرط الإيداعات.</div>
        ${btn}
        <div style="font-size:11px;color:var(--hint);margin-top:8px">مكافآت حضور مستحقة: <b style="color:var(--gold)">${fmt(ck.pending_balance||0)}</b> ل.س | إجمالي أيام الحضور: ${ck.total_checkins||0}</div>
      </div>`:'';

    const lbHtml=feat.leaderboard_enabled!==false?`
      <div class="info-card">
        <div class="title"><span>🏆 لوحة الصدارة</span></div>
        ${topHtml||'<div class="empty">لا يوجد لاعبون بعد</div>'}
        ${myHtml}
      </div>`:'';

    el.innerHTML=checkinHtml+lbHtml;
  }catch(e){el.innerHTML='<div class="error-box">تعذّر التحميل</div>'}
}

// بدء التشغيل
loadAll().finally(()=>setTimeout(showLogoHintOnce,700));
